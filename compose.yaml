name: friend-review-db

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: friend_review
      POSTGRES_USER: friend_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friend_app -d friend_review"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - friend_review_pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/project-sql:ro

volumes:
  friend_review_pgdata:
